[package]
name = "constraint_runtime"
version = "0.1.0"
edition = "2021"
description = "Model E constraint IR and owned sparse solver for scientific illustration sketches"
license = "MIT OR Apache-2.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "solve"
harness = false

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
