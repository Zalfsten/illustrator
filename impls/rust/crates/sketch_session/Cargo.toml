[package]
name = "sketch_session"
version = "0.1.0"
edition = "2021"
description = "Command session for constraint_runtime: atomic named commands, undo/redo"
license = "MIT OR Apache-2.0"

[dependencies]
constraint_runtime = { path = "../constraint_runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1.2"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
