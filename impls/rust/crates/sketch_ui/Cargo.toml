[package]
name = "sketch_ui"
version = "0.1.0"
edition = "2021"
description = "Minimal egui front-end for constraint_runtime"
license = "MIT OR Apache-2.0"

[dependencies]
constraint_runtime = { path = "../constraint_runtime" }
sketch_session = { path = "../sketch_session" }
eframe = { version = "0.29", default-features = true }
egui = "0.29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[dev-dependencies]
serde_json = "1"
