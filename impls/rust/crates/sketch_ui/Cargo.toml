[package]
name = "sketch_ui"
version = "0.1.0"
edition = "2021"
description = "Minimal egui front-end for constraint_runtime"
license = "GPL-3.0-or-later"

[dependencies]
constraint_runtime = { path = "../constraint_runtime" }
sketch_session = { path = "../sketch_session" }
label_layout = { path = "../label_layout" }
eframe = { version = "0.29", default-features = true }
egui = "0.29"

# The Typst engine is linked natively; the browser runs it in the label_worker
# Web Worker through label_web (#60).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
label_typst = { path = "../label_typst" }
# Native file dialogs (xdg-desktop-portal on Linux), run on a thread (#8).
rfd = "0.17"
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
label_web = { path = "../label_web" }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.82"
web-sys = { version = "0.3.105", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Node",
    # File services (#8): file input, download, leave warning.
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement",
    "File", "FileList", "Event", "EventTarget", "BeforeUnloadEvent",
] }

[dev-dependencies]
serde_json = "1"
