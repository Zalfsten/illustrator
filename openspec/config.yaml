schema: spec-driven

# Project context — durable product and process principles for all changes.
# Applied when creating OpenSpec artifacts; do not copy verbatim into them.
context: |
  Product goal:
  Build 2D illustration software for scientific publications and teaching.
  Figures combine durable geometric relationships (right angles, parallels,
  tangents, and similar constructions that survive later edits) with free
  illustration styling (line weight, dash, color, fill, arrows) and, later,
  full mathematical labels (LaTeX). This resolves the split between tools
  like xfig/tgif (flexible drawing, relationships break on edit) and CAD
  sketchers / SmartSketch-like tools (persistent constraints, rigid drafting
  output unsuitable for teaching schematics).

  Long-term figure examples (not all in the first change): coordinate axes
  with a function curve and a constrained tangent plus angle/formula labels;
  freeform "potato" bodies with infinitesimal elements; geometric primitives,
  arrows, and labels under persistent constraints.

  Spec vs design (one spec, many implementations):
  Shared OpenSpec capabilities define functionality and overarching software
  architecture (domain ontology, constraint semantics, interaction contracts).
  Programming language, libraries, operating system, GUI toolkit, packaging,
  and concrete numerical algorithms are design decisions of each
  implementation. Multiple parallel implementations may live in this repo,
  all conforming to the same specs while differing in design.md (and code).

  First slice:
  Early work proves the constraint runtime (Model E IR, small catalog,
  drag-under-invariants, owned swappable solver). Illustration features
  (styles, LaTeX, export, function graphs) arrive in later changes under
  the same principles.

  Geometry ontology (points vs vectors):
  In the plane, the free vector (displacement / direction) is the more
  fundamental object. A point is an affine location that may be represented
  by a position vector relative to a chosen origin, but it is not the same
  kind of quantity as a free vector. Specs, docs, and implementations MUST
  distinguish them in naming and types (e.g. Vec2 / Vector2 for free vectors
  including segment directions and differences of points; Point2 only for
  locations). Do not overload a single "Point2" type for both. Operations
  must respect the distinction: point − point → vector; point + vector →
  point; vector + vector → vector; point + point is not meaningful.

  Point / vector / length expressions (opaque, Model B):
  A point, free-vector, or length expression is an opaque handle to a
  geometry-kind-owned formula that maps parameter State \(p\) to a Point2, Vec2,
  or Length (plus connectivity / MatrixWrite). Do not expose formula-kind
  variants on the public expression type (no formula-kind match in the
  constraint path). Internally shared capability formula tags are keyed by
  geometry kind in a closed sum for dispatch. Point and free-vector Jacobians
  are both 2×n; length Jacobians are 1×n, written into MatrixView with
  formula-local columns (sparse vs full geometry block). Parallel/Orthogonal
  may write \(g^\top J_v\) via accumulate_contracted. Typed scalar families
  stay separate
  (LengthExpr today; AngleExpr when a kind needs angles — no untyped
  ScalarExpr). Parallel/Orthogonal take two opaque vector expressions;
  EqualLength takes two LengthExprs. Geometries construct expressions via
  capability factories (CurveExprs / EndpointExprs); constraints, Mesh, and
  Interact only evaluate them. See docs/constraint-mathematics.md
  (Design decision: opaque expressions).

  Geometry identity and resolution:
  One stable GeometryId for all kinds (no segment-only id type). Document
  owns IdGenerator<GeometryId> / IdGenerator<ConstraintId> (allocate on add;
  observe on register/import).
  Expression evaluation resolves ids through a read-only geometry port
  (linux-rust: GeometryStore → &GeometryInst), then unpacks charts via
  InGeometryCatalog (no second id lookup inside unpack).

  State layout (contiguous blocks):
  Each geometry owns a contiguous parameter block in the global State vector
  \(p\) (offset + parameter count / parameter window). Geometries do not share
  State indices; joins are constraints (e.g. Congruence), not aliased DOFs.
  Connectivity for assembly is derived from that block. Committed and working
  copies share one owned vector type (linux-rust: Vector). Assembled residual
  \(r\) is a separate Vector of length m. Structural add/remove goes through
  the Document composite so graph and State stay length-matched; kinds
  pack/unpack chart init and own formulas, and evaluate reads the geometry's
  recorded parameter window. See openspec/specs/state-vector/spec.md
  (Contiguous parameter block per geometry; atomic structural edits).

  Rust module and unit-test layout (impls/linux-rust):
  constraint_runtime splits geometry concerns as follows:
  - geom: shared affine / scalar DOF types (Point2, Vec2, Angle, Length,
    CurveParam); formula Jacobians accumulate into MatrixView
  - geometry/:
    - shell.rs: GeometryShell, GeometryId, roles, AsShell,
      geometry_shell_instance!
    - geometry.rs: GeometryKind marker (shell/param-block helpers; no dyn)
    - chart.rs: StateAtom, ChartSlot, PackAtoms, Chart, chart_atoms!
      (named slots + pack/unpack from Init tuples)
    - capabilities.rs: CurveExprs / EndpointExprs; shared formula tags;
      CurveFormulaKey / EndpointFormulaKey with blankets (factories)
    - expr.rs: opaque PointExpr / VecExpr / LengthExpr; register_expr_kinds!
      (keyed enums, evaluate / param_indices / param_count / jacobian
      dispatch, VecExpr::accumulate_contracted from the 2×n Jacobian via
      stack scratch, and CurveFormulaKey / EndpointFormulaKey for listed kinds)
  - id.rs: IdGenerator<Id> (shared by geometry + constraint namespaces)
  - geometry_kinds/: GeometryInst closed catalog enum (Segment today) +
    InGeometryCatalog; per kind file: shell + chart_atoms!; eval_* +
    accumulate_*_jacobian (set_scaled); optional sparse endpoint param
    helpers; register_expr_kinds! entry. Document:
    HashMap<GeometryId, GeometryInst>; add_geometry: GeometryKind + Into<GeometryInst>.
  - constraint.rs: ConstraintKind (generic over GeometryStore / VecWrite /
    MatrixWrite). ConstraintId + ConstraintEntry (ConstraintInst body).
  - constraint_kinds/: per-kind files + ConstraintInst catalog enum;
    add_constraint: Into<ConstraintInst>.
  - matrix.rs: owned Matrix; borrowed DenseMatrix / ScatterMatrix (conn
    borrowed); MatrixView / MatrixWrite (block_slice, set_scaled). Scatter
    via inherent DenseMatrix::scatter_slice.
  - vector.rs: owned Vector (p and r); borrowed DenseVec / ScatterVec;
    VecView / VecWrite (as_dense / block_slice / scatter_slice)
  - assemble: AssembledSystem(&'a Document, soft); caches structural
    param_connectivity at construction (graph-only; not p-dependent).
    SoftContribution is session-only (parameter index + target + weight);
    soft-vs-hard strength is in SoftTerms / SoftContribution.weight
    (sqrt(w) in residual), not a separate structural rescale in assembly.
    SystemEval fills Vector r and Matrix J.
  - interact: SoftTerms (mouse/stay weights); soft_for_drag builds
    SoftContribution list; InteractiveSolve commits working Vector
  - store: GeometryStore port (id → &GeometryInst); implemented by Document
  - mapper: column maps (geometry_indices / local_indices / join_indices);
    unpack_chart on &impl Chart+AsShell; chart_param_block Range for slices
  - document: discrete graph + committed Vector; HashMaps by id; incidence /
    Congruence identification indexes
  - solver: SolverPort::solve<E: SystemEval>; SystemEval fills Vector r /
    Matrix J; LM reuses scratch; FFI EvalHandle uses &dyn SystemEval only
    for the C trampoline + residual/jacobian scratch reuse
  Prefer sibling files once a module has unit tests: src/<module>.rs for
  production code and src/tests_<module>.rs for that module's unit tests,
  declared with `#[cfg(test)] #[path = "tests_<module>.rs"] mod tests_<module>;`
  in <module>.rs. Do not create a src/<module>/ directory solely to hold
  tests. A module directory exists only when there are real nested
  submodules (e.g. solver.rs + solver/ffi.rs + solver/tests_ffi.rs and
  src/tests_solver.rs). Do not use anonymous mod.rs / tests.rs pairs.
  Do not put large unit-test suites inline at the bottom of foo.rs.
  Integration/acceptance tests that only need the public API stay under
  crates/<name>/tests/ (e.g. acceptance.rs). Unit tests that need private
  items belong in tests_<module>.rs, not in the crate-level tests/ directory.

# Per-artifact rules
rules:
  proposal:
    - Ground the change in the product goal from project context; state how it advances or deliberately narrows that goal.
    - Include an explicit Non-goals (or equivalent deferrals) section relative to the long-term product vision when scope is a slice.
    - Do not treat a single implementation stack as the product; note that specs stay shared across implementations.
  specs:
    - Keep requirements implementation-agnostic: no mandated programming language, OS, GUI toolkit, or library.
    - Do not require a specific solver algorithm by name; specify observable solve/interaction behavior and replaceable backends instead.
    - Express overarching architecture as domain contracts (e.g. Model E, hard vs soft conditions), not as code module layouts of one impl.
    - Keep points and free vectors distinct in domain language; do not treat directions or displacements as points.
  design:
    - Record language, libraries, OS/GUI, repo layout, and solver algorithm choices here for the target implementation.
    - Assume other implementations may exist later under the same specs; prefer clear backend/UI boundaries.
  tasks:
    - Scope tasks to the implementation(s) named in design.md; do not invent parallel impls unless the change asks for them.
    - Prefer proving the shared runtime contracts with tests before expanding illustration UI features.
    - For linux-rust: place new unit tests in src/tests_<module>.rs (sibling of <module>.rs), not inline at the bottom of a monolithic .rs file; create a module directory only for real nested submodules.

# Per-operation guidance
operations:
  apply:
    guidance:
      - Implement against the shared specs; keep impl-specific choices aligned with design.md.
      - For linux-rust Rust code: keep unit tests as src/<module>.rs + src/tests_<module>.rs (#[path]); module directories only for nested submodules; do not reintroduce large inline #[cfg(test)] blocks or anonymous mod.rs/tests.rs pairs.
  archive:
    guidance:
      - Summarize what became shared capability truth versus what remained impl-specific design.
