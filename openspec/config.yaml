schema: spec-driven

# Project context — durable product and process principles for all changes.
# Applied when creating OpenSpec artifacts; do not copy verbatim into them.
context: |
  Product goal:
  Build 2D illustration software for scientific publications and teaching.
  Figures combine durable geometric relationships (right angles, parallels,
  tangents, and similar constructions that survive later edits) with free
  illustration styling (line weight, dash, color, fill, arrows) and, later,
  full mathematical labels (LaTeX). This resolves the split between tools
  like xfig/tgif (flexible drawing, relationships break on edit) and CAD
  sketchers / SmartSketch-like tools (persistent constraints, rigid drafting
  output unsuitable for teaching schematics).

  Long-term figure examples (not all in the first change): coordinate axes
  with a function curve and a constrained tangent plus angle/formula labels;
  freeform "potato" bodies with infinitesimal elements; geometric primitives,
  arrows, and labels under persistent constraints.

  Spec vs design (one spec, many implementations):
  Shared OpenSpec capabilities define functionality and overarching software
  architecture (domain ontology, constraint semantics, interaction contracts).
  Programming language, libraries, operating system, GUI toolkit, packaging,
  and concrete numerical algorithms are design decisions of each
  implementation. Multiple parallel implementations may live in this repo,
  all conforming to the same specs while differing in design.md (and code).

  First slice:
  Early work proves the constraint runtime (Model E IR, small catalog,
  drag-under-invariants, owned swappable solver). Illustration features
  (styles, LaTeX, export, function graphs) arrive in later changes under
  the same principles.

  Geometry ontology (points vs vectors):
  In the plane, the free vector (displacement / direction) is the more
  fundamental object. A point is an affine location that may be represented
  by a position vector relative to a chosen origin, but it is not the same
  kind of quantity as a free vector. Specs, docs, and implementations MUST
  distinguish them in naming and types (e.g. Vec2 / Vector2 for free vectors
  including segment directions and differences of points; Point2 only for
  locations). Do not overload a single "Point2" type for both. Operations
  must respect the distinction: point − point → vector; point + vector →
  point; vector + vector → vector; point + point is not meaningful.

  Angle ontology (heading vs turn):
  Same absolute/free split as Point2 / Vec2. HeadingAngle is an absolute
  orientation from a fixed planar null ray; TurnAngle is a free angular
  displacement. Operations: heading − heading → turn; heading ± turn →
  heading; turn ± turn → turn; heading + heading is not meaningful. Do not
  overload a single Angle type for both. Radians as State DOFs; no wrap at
  the type level (arc conventions come with kinds that use them).

  Point / vector / length / angle expressions (opaque, Model B):
  A point, free-vector, or typed scalar expression is an opaque handle (a
  geometry id plus a kind-agnostic formula tag) to a geometry-kind-owned
  formula that maps parameter State \(p\) to a Point2, Vec2, Length,
  HeadingAngle, or TurnAngle (plus connectivity / Jacobian). Do not
  expose formula-kind variants on the public expression type (no
  formula-kind match in the constraint path). The kind behind the id is
  resolved once per call through a closed kind catalog. Point and
  free-vector Jacobians are both 2×n; length / heading / turn Jacobians are
  1×n, written into a DenseMatrix window with formula-local columns (sparse vs
  full geometry block). VectorsParallel/VectorsOrthogonal contract \(g^\top J_v\) from a
  vector jet. Typed scalar families stay separate (LengthExpr,
  HeadingAngleExpr, TurnAngleExpr — no untyped ScalarExpr / single
  AngleExpr). VectorsParallel/VectorsOrthogonal take two opaque vector expressions;
  EqualLength takes two LengthExprs. Geometries construct expressions via
  capability factories (CurveExprs / EndpointExprs); constraints, Mesh, and
  Interact only evaluate them. See docs/constraint-mathematics.md (Design
  decision: opaque expressions).

  Geometry identity and resolution:
  One stable GeometryId for all kinds (no segment-only id type). Document
  owns IdMap<GeometryId, GeometryInst> / IdMap<ConstraintId,
  ConstraintEntry> (id allocated on add; id order fixes assembly row
  order). Expression evaluation resolves the id to &GeometryInst once, then
  dispatches on its GeometryKind (with_kind!) and unpacks the chart from the
  geometry's parameter window (no second id lookup).

  State layout (contiguous blocks):
  Each geometry owns a contiguous parameter block in the global State vector
  \(p\) (offset + parameter count / parameter window). Geometries do not share
  State indices; joins are constraints (e.g. Congruence), not aliased DOFs.
  Connectivity for assembly is derived from that block. Committed and working
  copies share one owned vector type (impls/rust: Vector). Assembled residual
  \(r\) is a separate Vector of length m. Structural add/remove goes through
  the Document composite so graph and State stay length-matched; kinds
  pack/unpack chart init and own formulas, and evaluate reads the geometry's
  recorded parameter window. See openspec/specs/state-vector/spec.md
  (Contiguous parameter block per geometry; atomic structural edits).

  Platform boundary:
  The core (Document, evaluation, assembly, solver, Interact, Mesh, App
  presentation logic) is platform-neutral and runs unchanged natively and in
  the browser (WebAssembly). Host services (files, clipboard, time, sharing)
  go through one replaceable host boundary with completion-based delivery
  and runtime-discoverable optional capabilities (system-architecture spec).
  impls/rust: `cfg(target_arch)` only in sketch_ui/src/main.rs and Cargo
  target tables; scripts/check-wasm.sh guards the wasm32 build; the
  `Platform` trait arrives with the first host-service feature.

  Rust module and unit-test layout (impls/rust):
  constraint_runtime splits concerns as follows:
  - geom: shared affine / scalar DOF types (Point2, Vec2, HeadingAngle,
    TurnAngle, Length, CurveParam)
  - expr.rs: generic opaque Expr<F> with aliases PointExpr / VecExpr /
    LengthExpr / HeadingAngleExpr / TurnAngleExpr; evaluate /
    param_indices / param_count / accumulate_jacobian; VecExpr::jet +
    VecJet::contract_into (stack scratch, gᵀJᵥ)
  - geometry/:
    - shell.rs: GeometryShell, GeometryId, GeometryRole
    - chart.rs: StateAtom, ChartSlot, Chart, chart_atoms! (named slots +
      pack/unpack from Init tuples)
    - formula.rs: Geometry (what a kind implements: value / Jacobian /
      connectivity per formula family) and Formula (tag family → that
      triple), formula_family!
    - capabilities.rs: kind-agnostic formula tags (PointFormula,
      VecFormula, LengthFormula, HeadingFormula, TurnFormula) and opt-in
      factories CurveExprs / EndpointExprs, plus invariant capabilities
      LineExprs (direction), CircularExprs (center, radius |R|) and
      AnchorExprs (origin); every capability is opt-in, curve included
      (geometry_caps!(Segment: curve, endpoints, line)), and a kind
      declares them once with geometry_caps! (trait impls + runtime Caps);
      dynamic ids use Document::caps and Option-returning id-based
      factories (Document::direction_expr, …)
  - id.rs: IdMap<Id, T> (typed id → value storage; shared by geometry and
    constraint namespaces)
  - geometry_kinds/: catalog.rs (data-less GeometryKind enum, GeometryInst
    with KindAttrs — non-parameter attributes, default per kind via
    Geometry::default_attrs — and with_kind! dispatch); per kind file:
    chart_atoms! layout +
    geometry_caps! (opt-in factory traits + Caps) + impl Geometry
    (Jacobians via set_scaled) with NAME_PREFIX (seg, arc). Kinds
    today: Segment (2×Point2), Arc (center Point2, Length radius ≥ 0 in
    committed State via Geometry::canonical on add / commit, HeadingAngle
    start, TurnAngle sweep), Label (prefix lbl; origin Point2 + heading
    HeadingAngle; caps anchor + line, no curve; LabelAttrs: source,
    Markup, HAlign, VAlign, offset in pt in the label frame, size or
    inherited). Document also holds DocumentSettings (scale mm per world
    unit, font_size pt, preamble).
  - mesh.rs: Display Mesh from Document+State; open curves tessellated via
    on_curve + adaptive subdivision until tangent turn per interval ≤
    MAX_CHORD_TURN (π/8), max 64 samples; endpoint hits use geometric
    start/end expressions only, and only for kinds with the endpoints
    capability (tessellation itself needs only CurveExprs).
  - names.rs: user-visible object names (one namespace for geometries
    and constraints, unique at any time); Names table owned by Document
    (name ↔ ObjectId, stem → numbers index); automatic names are
    <NAME_PREFIX><max in use + 1>, derived from current names (no stored
    counter); remove_geometry / remove_constraint return a Removal with
    the dropped names (cascade included).
  - address.rs: `<name>.<suffix>` addresses (start, end, center, at(t),
    direction, tangent(t), normal(t), length, radius) resolved through
    the id-based capability factories; point/vec/length_address print
    expressions back.
  - point_classes.rs: congruence classes (transitive closure of
    Congruence, never by distance) and logical_points(filter), one
    LogicalPoint per class with a visible endpoint; structure-only, so
    the App rebuilds handles after structural changes, not per drag step;
    Interact puts the whole class under the mouse target.
  - components.rs: components of the constraint graph (geometries
    connected through constraints; structure-only, computed on demand)
    and their consistency: component_residual at committed values vs
    COMMIT_TOL (= 10 × SOLVE_TOL), the single threshold for both commit
    gate and classification; Document::whole is the all-components scope.
  - constraint.rs: ConstraintKind (RESIDUAL_ARITY, NAME_PREFIX, param_connectivity,
    eval_residual, accumulate_jacobian(&mut DenseMatrix),
    referenced_geometries as a deduplicated GeometryId list); ConstraintId
    + ConstraintEntry (ConstraintInst body).
  - constraint_kinds/: catalog.rs (closed ConstraintInst, generated from
    the kind list) + per-kind files (prefixes join, par, orth, fix,
    eqlen); add_constraint: Into<ConstraintInst>.
  - matrix.rs: borrowed DenseMatrix (packed or window, also over plain
    Vec<f64> buffers);
    block_slice / set_scaled / fill (no matrix trait: DenseMatrix is the
    only writable window); BlockSparseMatrix: sparse m×n matrix of dense
    row blocks, one per contribution with its own column map (block_mut =
    dense submatrix, no scatter on write; blocks(), transpose_mul,
    add_to_dense sum duplicate columns; no mutable global (i, j) access).
  - vector.rs: owned Vector (p and r); borrowed windows are plain slices.
  - assemble: AssembledSystem(&'a Document, soft, soft_points,
    soft_lengths): new_jacobian builds the BlockSparseMatrix structure
    from contribution connectivity (graph-only; not p-dependent; once per
    solve); block order structural, soft slots, soft point follows, soft
    length floors; residual uses a running row offset. SoftContribution, SoftPointFollow, SoftLengthFloor
    are session-only; soft-vs-hard strength is in SoftTerms / per-term
    weight (sqrt(w) in residual), not a separate structural rescale.
    SoftLengthFloor is one-sided max(0, ℓ_min − L). SystemEval fills
    Vector r and BlockSparseMatrix J.
  - interact: SoftTerms (mouse/stay weights + min_curve_length_fraction);
    soft_for_drag builds SoftContribution / SoftPointFollow /
    SoftLengthFloor (ℓ_min = fraction × L0 at drag-start snapshot);
    InteractiveSolve (default backend LmSolver) solves a scope (one or
    more components; AssembledSystem::scoped keeps only their constraint
    rows), gates on the scope's residual and copies only the scope's
    parameter blocks back (commit on success, fallback on failure), so
    other components never change; solve_commit / structural_only use
    the whole document. DragSession scopes every step to the dragged
    point's component (no history of its own; history lives in
    sketch_session).
  - document: discrete graph + committed Vector; IdMap stores; incidence /
    Congruence identification indexes.
  - solver: SolverPort::solve<E: SystemEval>; SystemEval exposes
    n_params / n_residuals, residual, new_jacobian (structure, once per
    solve) and jacobian (values). LmSolver: owned sparse
    Levenberg–Marquardt (normal.rs assembles JᵀJ / Jᵀr from blocks with
    precomputed slots; sparse_chol.rs wraps faer sparse Cholesky, symbolic
    once per solve, numeric per iteration; hot path allocation-free).
  sketch_session (crate on top of constraint_runtime): Session owns
  Document, InteractiveSolve, DragSession and undo/redo stacks of Document
  snapshots. Command enum addresses objects by name / address text;
  apply = snapshot, execute, structural solve for constraint commands,
  commit or restore (CommandError incl. Unsatisfiable, Busy while
  dragging). drag_begin/to/end/cancel; a completed drag is one undo step.
  Contradictions are held per component: a conflicted (inconsistent)
  component is frozen, so a constraint touching it or a drag_begin in it
  fails with CommandError::Frozen; a constraint on consistent components
  solves only the merged component (Unsatisfiable if it fails); a delete
  inside a frozen component gives each surviving piece one solve.
  Session::new solves each inconsistent component once (rest stay
  frozen); Session::conflicts lists frozen components (names, residual).
  file.rs: the native sketch file (FORMAT "illustrator-sketch", VERSION 1):
  Session::save writes the declarative list in a fixed layout (one command
  per line, byte-identical round trip); Session::load reads any JSON layout
  (check order: JSON, format, version + migrate, envelope fields, commands),
  executes commands in Mode::Load (no frozen check, no solve, no history),
  then Session::start returns the session plus LoadReport (adjusted
  components with sampled curve displacement, conflicts). LoadError names the
  failing command's index. Bytes only; hosts move them.
  Command = Create / Constrain / Delete / Rename / SetRole; DeclCommand is
  the declarative subset (Create / Constrain with mandatory name). Kind
  payloads come from layer traits in kinds/ (GeometryCommand /
  ConstraintCommand on the core kind types: TAG, Params, init / resolve,
  params for export); catalog.rs (command_catalog!) generates GeometrySpec /
  ConstraintSpec and all dispatch, no per-kind match in session.rs.
  json.rs: flat strict interchange form (op, kind, name, role reserved;
  two-step read through serde_json::Value, deny_unknown_fields); wire.rs:
  [x, y] points, finite numbers, typed address strings; schema.rs composes
  JSON Schemas, checked in under sketch_session/schema/ (tests/schema.rs,
  UPDATE_SCHEMA=1). Session::declarative_commands exports a drawing.
  constraint_runtime stays serde-free.
  label_layout (engine-neutral, wasm-capable): LineTypesetter engine
  trait (one line in, TypesetLine out: Shapes of Contours in pt in the
  label frame,
  y up, width as set, visible height/depth; TypesetError Unsupported /
  Invalid), split_lines (own scanner: `\\` at top level for latex,
  newline for text), baselines (max(1.2·size, depth+height+1pt)),
  line_origins + frame_map / place (pt -> world via document scale),
  tessellate (lyon); the asynchronous Typesetter port (request /
  take_completed / state Loading|Ready|Failed, LineRequest as key) with
  Immediate<E> over an engine; wire.rs: JSON messages to the worker via
  serde mirror types (WireRequest, WorkerMessage ready|line). label_typst
  (engine; native, and in the browser inside label_worker): TypstTypesetter with
  typst/typst-layout =0.15.1 and mitex =0.2.4 (convert_text, preamble
  prepended, rename table applied inside math only); assets/ holds the
  two NewCM fonts (from typst-assets) and mitex's Typst files with
  xarrow replaced, each with a NOTICE.
  sketch_ui edits only through the Session (sample scene is the baseline).
  It paints labels via labels.rs (LabelCache: per line Pending / Done,
  swept per frame, plus each label's last complete rendering; label_paint
  -> PaintItem Typeset triangles or Fallback with FallbackReason Pending
  (grey) | Failed | NoTypesetter | LoadFailed). Host services come from
  platform.rs (Platform trait, Host struct); main.rs builds Host with
  Immediate<TypstTypesetter> natively and label_web::WorkerTypesetter in
  the browser (label_worker Web Worker, started by label_worker_boot.js
  on the first label line).
  Prefer sibling files once a module has unit tests: src/<module>.rs for
  production code and src/tests_<module>.rs for that module's unit tests,
  declared with `#[cfg(test)] #[path = "tests_<module>.rs"] mod tests_<module>;`
  in <module>.rs. Do not create a src/<module>/ directory solely to hold
  tests. A module directory exists only when there are real nested
  submodules (e.g. solver.rs + solver/normal.rs + solver/tests_normal.rs and
  src/tests_solver.rs). Do not use anonymous mod.rs / tests.rs pairs.
  Do not put large unit-test suites inline at the bottom of foo.rs.
  Integration/acceptance tests that only need the public API stay under
  crates/<name>/tests/ (e.g. acceptance.rs). Unit tests that need private
  items belong in tests_<module>.rs, not in the crate-level tests/ directory.

# Per-artifact rules
rules:
  proposal:
    - Ground the change in the product goal from project context; state how it advances or deliberately narrows that goal.
    - Include an explicit Non-goals (or equivalent deferrals) section relative to the long-term product vision when scope is a slice.
    - Do not treat a single implementation stack as the product; note that specs stay shared across implementations.
  specs:
    - "Keep requirements implementation-agnostic: no mandated programming language, OS, GUI toolkit, or library."
    - Do not require a specific solver algorithm by name; specify observable solve/interaction behavior and replaceable backends instead.
    - Express overarching architecture as domain contracts (e.g. Model E, hard vs soft conditions), not as code module layouts of one impl.
    - Keep points and free vectors distinct in domain language; do not treat directions or displacements as points.
  design:
    - Record language, libraries, OS/GUI, repo layout, and solver algorithm choices here for the target implementation.
    - Assume other implementations may exist later under the same specs; prefer clear backend/UI boundaries.
  tasks:
    - Scope tasks to the implementation(s) named in design.md; do not invent parallel impls unless the change asks for them.
    - Prefer proving the shared runtime contracts with tests before expanding illustration UI features.
    - "For impls/rust: place new unit tests in src/tests_<module>.rs (sibling of <module>.rs), not inline at the bottom of a monolithic .rs file; create a module directory only for real nested submodules."

# Per-operation guidance
operations:
  apply:
    guidance:
      - Implement against the shared specs; keep impl-specific choices aligned with design.md.
      - "For impls/rust Rust code: keep unit tests as src/<module>.rs + src/tests_<module>.rs (#[path]); module directories only for nested submodules; do not reintroduce large inline #[cfg(test)] blocks or anonymous mod.rs/tests.rs pairs."
  archive:
    guidance:
      - Summarize what became shared capability truth versus what remained impl-specific design.
